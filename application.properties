# ---- MySQL connection settings ----
# Change 'your_mysql_password' below to your real MySQL root password.
# The database "course_registration" will be created automatically if it doesn't exist.
spring.datasource.url=jdbc:mysql://localhost:3306/course_registration?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate settings ----
# "update" means Hibernate creates/updates tables automatically to match our
# Java classes. Great for learning; for production you'd normally use migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server port ----
server.port=8080
